<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广告管理</title><link rel="stylesheet" href="../assets/css/admin.css"></head>
<body><aside class="admin-side"><h3>后台演示</h3><a href="index.html">仪表盘</a><a class="on" href="ads.html">广告管理</a><a href="experts.html">专家管理</a><a href="users.html">用户与密码</a><a href="finance.html">融资管理</a><a href="news.html">新闻管理</a><a href="messages.html">留言管理</a></aside>
<main class="admin-main"><h2>广告管理</h2><table><thead><tr><th>标题</th><th>广告位</th><th>图片</th><th>状态</th><th>操作</th></tr></thead><tbody id="adminAdsTable"></tbody></table>
<section class="panel"><h3>新增广告位</h3><form id="adForm"><div class="form-grid"><div><label>广告位</label><select name="slot"><option value="HOME_TOP_BANNER">首页顶部轮播</option><option value="HOME_MID_BANNER">首页中部通栏</option><option value="HOME_BOTTOM_BANNER">首页底部通栏</option><option value="HOME_TILE">首页分块广告</option></select></div><div><label>标题</label><input name="title" required></div><div><label>跳转链接</label><input name="linkUrl" placeholder="#"></div><div><label>上下线状态</label><select name="status"><option value="online">上线</option><option value="offline">下线</option></select></div><div><label>分块尺寸（仅分块广告生效）</label><select name="size"><option value="small">小块</option><option value="large">大块</option></select></div><div><label>图片链接</label><input name="imageUrl" placeholder="https://..."></div><div><label>上传广告图片</label><input type="file" accept="image/*" name="imageFile"></div></div><p><button type="submit">保存广告位</button></p></form></section></main>
<script src="../assets/js/data.js"></script><script src="../assets/js/admin.js"></script></body></html>
