<body><aside class="admin-side"><h3>后台演示</h3><a href="index.html">仪表盘</a><a href="ads.html">广告管理</a><a class="on" href="experts.html">专家管理</a><a href="users.html">用户与密码</a><a href="finance.html">融资管理</a><a href="news.html">新闻管理</a><a href="messages.html">留言管理</a></aside>
<main class="admin-main"><h2>专家管理</h2><table><thead><tr><th>姓名</th><th>头衔</th><th>头像</th><th>名片</th><th>状态</th><th>操作</th></tr></thead><tbody id="adminExpertsTable"></tbody></table>
<section class="panel"><h3>新增专家</h3><form id="expertForm"><div class="form-grid"><div><label>姓名</label><input name="name" required></div><div><label>头衔</label><input name="title" required></div><div><label>简介</label><textarea rows="3" name="summary"></textarea></div><div><label>状态</label><select name="status"><option value="online">启用</option><option value="offline">停用</option></select></div><div><label>头像链接</label><input name="avatarUrl" placeholder="https://..."></div><div><label>上传头像</label><input type="file" accept="image/*" name="avatarFile"></div><div><label>名片图片链接</label><input name="cardImageUrl" placeholder="https://..."></div><div><label>上传名片图片</label><input type="file" accept="image/*" name="cardFile"></div></div><p><button type="submit">保存专家信息</button></p></form></section></main>
<script src="../assets/js/data.js"></script><script src="../assets/js/admin.js"></script></body></html>
