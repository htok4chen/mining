<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专家展示</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body>
<div class="topbar"><div class="container"><div>欢迎访问矿业信息服务平台（演示）</div><div>服务热线：400-000-0000</div></div></div>
<header class="header"><div class="container header-inner"><a class="logo" href="index.html"><img src="assets/images/logo.png"><h1>矿业信息服务平台</h1></a><button class="menu-toggle">菜单</button><nav class="nav"><ul><li><a href="index.html">首页</a></li><li><a href="experts.html" class="active">专家展示</a></li></ul></nav></div></header>
<div class="breadcrumb"><div class="container">当前位置：首页 / 专家展示</div></div>
<section class="section"><div class="container"><div class="panel-title"><h3>特聘专家</h3></div><div class="grid grid-3" id="expertGrid"></div></div></section>
<footer class="footer"><div class="container"><div class="copyright">版权 © 2026 矿业信息服务平台</div></div></footer>
<script src="assets/js/data.js"></script><script src="assets/js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  const box=document.querySelector("#expertGrid");
  const d=(window.getDemoExperts&&window.getDemoExperts()||[]).filter(e=>e.status!=="offline");
  box.innerHTML=d.map(e=>`<article class="card"><img src="${e.avatarUrl}"><div class="card-body"><h4 class="card-title">${e.name}</h4><p class="card-desc">${e.title}</p><p class="card-desc">${e.summary||""}</p><p><a class="btn" target="_blank" href="${e.cardImageUrl||e.avatarUrl}">查看名片</a></p></div></article>`).join("");
});
</script></body></html>
