<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后台管理系统 — 矿业信息服务平台</title><link rel="stylesheet" href="/assets/admin.css"></head>
<body>

<!-- ========= Login Page ========= -->
<div id="loginPage" class="adm-login-page">
  <div class="adm-login-box">
    <div class="adm-login-logo">
      <h1>⛏ 矿业管理平台</h1>
      <p>请使用管理员账号登录</p>
    </div>
    <div class="adm-form-row"><label>用户名</label><input id="loginUser" class="adm-input" type="text" value="admin" placeholder="请输入用户名" autocomplete="username"></div>
    <div class="adm-form-row"><label>密码</label><input id="loginPass" class="adm-input" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <div id="loginErr" style="color:#c0392b;font-size:13px;margin-bottom:8px;min-height:18px"></div>
    <button class="btn-login" id="btnLogin" onclick="adminApp.login()">登录</button>
  </div>
</div>

<!-- ========= Admin Layout ========= -->
<div id="adminPage" class="adm-layout" style="display:none">

  <!-- Sidebar -->
  <aside class="adm-sidebar">
    <div class="adm-sidebar-logo">⛏ 矿业管理平台<small>后台管理系统</small></div>
    <nav class="adm-nav" id="admNav"></nav>
  </aside>

  <!-- Content -->
  <div class="adm-content">
    <header class="adm-header">
      <div class="adm-breadcrumb" id="admBreadcrumb">首页</div>
      <div class="adm-header-right">
        <span>👤 <span id="admUsername"></span></span>
        <button class="btn-logout" onclick="adminApp.logout()">退出登录</button>
      </div>
    </header>
    <main class="adm-main" id="admMain">
      <div class="adm-empty"><div class="adm-empty-icon">👈</div><div>请从左侧菜单选择要管理的模块</div></div>
    </main>
  </div>
</div>

<!-- ========= Form / Edit Modal ========= -->
<div id="admModal" class="adm-modal-overlay" style="display:none">
  <div class="adm-modal">
    <div class="adm-modal-hdr">
      <span id="admModalTitle">操作</span>
      <button class="adm-modal-close" onclick="adminApp.closeModal()" title="关闭">×</button>
    </div>
    <div class="adm-modal-body" id="admModalBody"></div>
    <div class="adm-modal-ftr">
      <button class="btn-default" onclick="adminApp.closeModal()">取消</button>
      <button class="btn-primary" id="admModalSubmit">确认</button>
    </div>
  </div>
</div>

<!-- ========= Confirm Dialog ========= -->
<div id="admConfirm" class="adm-modal-overlay" style="display:none">
  <div class="adm-modal adm-modal-sm">
    <div class="adm-modal-hdr">
      <span>⚠️ 确认操作</span>
      <button class="adm-modal-close" onclick="adminApp.closeConfirm()">×</button>
    </div>
    <div class="adm-modal-body" id="admConfirmMsg" style="padding:20px 20px 10px">确认要执行此操作吗？</div>
    <div class="adm-modal-ftr">
      <button class="btn-default" onclick="adminApp.closeConfirm()">取消</button>
      <button class="btn-danger" id="admConfirmOk">确认</button>
    </div>
  </div>
</div>

<!-- ========= Toast Container ========= -->
<div id="admToasts" class="adm-toasts"></div>

<script src="/admin/panel.js"></script>
</body></html>
