<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>留言反馈 - 矿业信息服务平台</title>
  <link rel="stylesheet" href="/assets/css/site-theme.css">
</head>
<body>

<script src="/assets/layout_header.js"></script>

<div class="container">
  <section class="section">
    <div class="section-header"><h2>留言反馈</h2></div>
    <div class="grid grid-2">
      <div>
        <form id="messageForm" onsubmit="siteApp.submitMessage(event)">
          <div class="form-group">
            <label>姓名</label>
            <input type="text" name="name" required placeholder="请输入姓名">
          </div>
          <div class="form-group">
            <label>电话</label>
            <input type="tel" name="phone" required placeholder="请输入电话">
          </div>
          <div class="form-group">
            <label>邀订箱</label>
            <input type="email" name="email" placeholder="请输入邀订箱">
          </div>
          <div class="form-group">
            <label>留言内容</label>
            <textarea name="content" required placeholder="请输入留言内容" rows="6"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">提交留言</button>
        </form>
      </div>
      <div>
        <div style="background: #fcd5ce; padding: 20px; border-radius: 8px;">
          <h4 style="margin-bottom: 16px;">联系方式</h4>
          <p><strong>电话</strong>：400-8666-888</p>
          <p><strong>邀订箱</strong>：info@kqjy.com</p>
          <p><strong>公司住所</strong>：北京市朝阳区...</p>
        </div>
      </div>
    </div>
  </section>
</div>

<script src="/assets/layout_footer.js"></script>

</body>
</html>
